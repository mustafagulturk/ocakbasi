name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, tip kontrolü, derleme
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocakbasi
          POSTGRES_PASSWORD: ocakbasi
          POSTGRES_DB: ocakbasi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ocakbasi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ocakbasi:ocakbasi@localhost:5432/ocakbasi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: packages/game/dist }

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
        working-directory: packages/game
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: packages/game/android
      - run: mv packages/game/android/app/build/outputs/apk/debug/app-debug.apk ocakbasi.apk
      - uses: actions/upload-artifact@v4
        with: { name: ocakbasi-apk, path: ocakbasi.apk }

  server-image:
    name: Sunucu Docker imajı
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/server/Dockerfile -t ocakbasi-api .

  pages:
    name: Web sürümünü yayınla
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          force_orphan: true

  release:
    name: Sürüm yayınla
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ocakbasi-apk }
      - uses: softprops/action-gh-release@v2
        with:
          files: ocakbasi.apk
          generate_release_notes: true
